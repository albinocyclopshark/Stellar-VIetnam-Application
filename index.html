<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdData Bounty</title>
    <style>
        :root { --bg-base: #0a0a0a; --bg-surface: #171717; --text-primary: #f5f5f5; --text-secondary: #a3a3a3; --accent: #6366f1; --accent-hover: #4f46e5; --success: #10b981; --border: #333333; font-family: system-ui, sans-serif; }
        body { background: var(--bg-base); color: var(--text-primary); display: flex; justify-content: center; padding: 2rem 1rem; margin: 0; }
        .app-container { width: 100%; max-width: 640px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
        .brand h1 { font-size: 1.5rem; margin: 0; }
        .brand span { color: var(--text-secondary); font-size: 0.875rem; }
        .btn { background: var(--accent); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; }
        .wallet-info { display: none; align-items: center; gap: 0.75rem; background: var(--bg-surface); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
        .main-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
        input { width: 100%; background: var(--bg-base); border: 1px solid var(--border); color: white; padding: 0.875rem; border-radius: 8px; margin: 0.5rem 0 1.5rem 0; box-sizing: border-box; }
        .result-area { margin-top: 1.5rem; padding: 1.25rem; border-radius: 8px; background: rgba(16, 185, 129, 0.05); border: 1px dashed var(--success); display: none; word-break: break-all; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <h1>CrowdData</h1><span>AI Bounty Platform</span>
            </div>
            <button id="connectBtn" class="btn">Kết nối Ví</button>
            <div id="walletInfo" class="wallet-info">
                <div class="status-dot"></div>
                <span id="wallet-address" style="font-family: monospace;"></span>
            </div>
        </header>

        <main class="main-card">
            <h2>Nộp Dữ Liệu Huấn Luyện</h2>
            <label style="color: var(--text-secondary); font-size: 0.875rem;">Đường dẫn hình ảnh (URL)</label>
            <input type="url" id="imageLink" placeholder="https://example.com/dataset/image_001.jpg">
            
            <button id="submitBtn" class="btn" style="width: 100%" disabled>Nộp dữ liệu & Nhận 1 XLM</button>

            <div id="resultArea" class="result-area">
                <div style="color: var(--success); font-weight: 600; margin-bottom: 0.5rem;">✔ Giao dịch thành công!</div>
                <div id="txHashDisplay" style="font-family: monospace; color: var(--text-secondary);"></div>
            </div>
        </main>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
